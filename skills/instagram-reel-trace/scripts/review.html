<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#f3f6fa;font:16px/1.55 system-ui,sans-serif}
main{max-width:min(900px,95vh);margin:auto;padding:16px}h1{font-size:clamp(21px,4vw,32px)}
.labels{display:flex;justify-content:space-around}video{width:100%;display:block;margin:6px 0 12px}
button{font:inherit;color:white;background:#203750;border:1px solid #77899a;border-radius:7px;padding:6px 14px;margin-right:6px}
button[aria-pressed=true]{background:#9de4db;color:#10242c}
</style><main><h1>__TITLE__</h1><div class="labels"><b>参考リール</b><b>試作</b></div>
<video controls playsinline></video><button aria-pressed="true">試作の音声</button><button aria-pressed="false">参考の音声</button></main>
<script>
const player = document.querySelector('video');
const buttons = Array.from(document.querySelectorAll('button'));
const sources = __SOURCES__;
let selected = 0;
player.src = sources[selected];
function switchSound(index) {
  if (selected === index) return;
  const position = player.currentTime;
  const resume = !player.paused;
  const rate = player.playbackRate;
  selected = index;
  buttons.forEach((button, i) => {
    button.disabled = true;
    button.setAttribute('aria-pressed', String(i === selected));
  });
  player.addEventListener('loadedmetadata', () => {
    player.currentTime = position;
    player.playbackRate = rate;
    buttons.forEach(button => button.disabled = false);
    if (resume) player.play().catch(() => {});
  }, {once:true});
  player.src = sources[index];
}
buttons.forEach((button, i) => button.onclick = () => switchSound(i));
</script></html>
